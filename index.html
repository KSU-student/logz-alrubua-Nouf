/* ① فتح تطبيق Gmail مباشرة (بدون سفاري) */
function openMail(e) {
  if (e) e.preventDefault();
  const to = encodeURIComponent(MAIL_TO);
  const su = encodeURIComponent("بشأن | لغز الربوع");
  const mailtoUrl = `mailto:${MAIL_TO}?subject=${su}`;
  const ua = navigator.userAgent || "";
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);

  // أندرويد: mailto يفتح Gmail عادةً
  if (isAndroid) { window.location.href = mailtoUrl; return; }

  // كمبيوتر: Gmail ويب
  if (!isIOS) {
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${su}`, '_blank', 'noopener');
    return;
  }

  // آيفون: نفتح تطبيق Gmail، وما نفتح بديل إلا إذا الصفحة ظلّت مكانها (يعني التطبيق ما انفتح)
  let left = false;
  const mark = () => { left = true; };
  document.addEventListener('visibilitychange', mark);
  window.addEventListener('pagehide', mark);
  window.addEventListener('blur', mark);

  window.location.href = `googlegmail:///co?to=${to}&subject=${su}`;

  setTimeout(() => {
    document.removeEventListener('visibilitychange', mark);
    window.removeEventListener('pagehide', mark);
    window.removeEventListener('blur', mark);
    if (!left && !document.hidden) window.location.href = mailtoUrl; // بديل: تطبيق البريد الافتراضي
  }, 2500);
}

/* ② جلب النقاط (يتحدّث كل مرة تدخلين الصدارة) */
async function fetchUserPointsFromSheet(phone) {
  const ptsText = document.getElementById('userPointsText');
  if (!ptsText) return;
  if (isUserAdmin()) { ptsText.textContent = "وضع الإشراف: لا تُحتسب نقاط"; return; }
  ptsText.textContent = "جاري جلب النقاط...";
  try {
    const res = await fetch(SCRIPT_URL + "?phone=" + encodeURIComponent(phone) + "&t=" + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    const pts = Number(data && data.points);
    ptsText.textContent = (isNaN(pts) ? userData.points : Math.max(pts, userData.points)) + " نقاط";
  } catch (e) {
    ptsText.textContent = userData.points + " نقاط";
  }
}

/* ③ التنقل: أي دخول لصفحة الصدارة يحدّث النقاط */
function navigateToStep(stepId) {
  const tape = document.getElementById('transitionTape');
  if (tape) tape.classList.add('active');

  setTimeout(() => {
    ['userInfoStep', 'quizStep', 'leaderboardStep', 'posterStep'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });
    const target = document.getElementById(stepId);
    if (target) target.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (stepId === 'quizStep' && !answeredThisSession) startFactsTyping();
    if (stepId === 'leaderboardStep') fetchUserPointsFromSheet(userData.phone);
  }, 400);

  setTimeout(() => { if (tape) tape.classList.remove('active'); }, 850);
}

function proceedAfterAnswer() {
  navigateToStep(config.leaderboardActive ? 'leaderboardStep' : 'posterStep');
}

/* ④ نقاط المشاركة: رسالة واضحة إذا ما انحسبت */
async function awardSharePoints() {
  if (isUserAdmin()) return null;
  return await api({ action: 'sharePoster', phone: userData.phone, caseTitle: caseTitle() });
}
