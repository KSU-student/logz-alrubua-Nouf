<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قضية اليوم - لغز الأربعاء</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #2a1245; --bg2: #6b3f9c;
      --ink: #fff; --soft: rgba(255,255,255,.72);
      --card: rgba(255,255,255,.09);
      --line: rgba(255,255,255,.22);
      --gold: #e9d5ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      width: 100%; max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 10px; text-align: center; font-size: 28px; }
    p.sub { text-align: center; color: var(--soft); margin-bottom: 20px; font-size: 14px; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="tel"] {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(0,0,0,0.2);
      color: #fff; font-size: 16px; font-family: inherit;
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: #8b5cf6; color: #fff; font-size: 18px; font-weight: bold;
      cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .btn:hover { background: #7c3aed; }
    .opt-btn {
      width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.05);
      color: #fff; font-size: 16px; cursor: pointer; text-align: center;
      font-family: inherit; transition: 0.2s;
    }
    .opt-btn:hover { background: rgba(255,255,255,0.15); }
    .result-box {
      margin-top: 20px; padding: 15px; border-radius: 12px; text-align: center;
    }
    .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; }
    .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- الخطوة الأولى: جمع البيانات -->
  <div class="card" id="userInfoStep">
    <h1>لغز الأربعاء ⚖️</h1>
    <p class="sub">وحدة الإرشاد الأكاديمي - كلية الحقوق والعلوم السياسية</p>
    <div class="field">
      <label>الاسم الثلاثي:</label>
      <input type="text" id="userName" placeholder="أدخلي اسمك الكامل">
    </div>
    <div class="field">
      <label>رقم الجوال:</label>
      <input type="tel" id="userPhone" placeholder="05xxxxxxxx">
    </div>
    <button class="btn" onclick="startQuiz()">الانتقال للغز</button>
  </div>

  <!-- الخطوة الثانية: القضية والخيارات -->
  <div class="card hidden" id="quizStep">
    <h1 id="qTitle">القضية الأولى</h1>
    <p class="sub" id="qText">اتفق سعد مع خالد شفهياً على بيع سيارته، واستلم منه عربوناً.. هل يحق لخالد إلزامه بإتمام البيع؟</p>
    
    <div id="options">
      <button class="opt-btn" onclick="submitAnswer(0)">نعم، يحق له</button>
      <button class="opt-btn" onclick="submitAnswer(1)">لا، لا يحق له</button>
    </div>

    <div id="result" class="result-box hidden"></div>
  </div>

<script>
  // رابط التطبيق المباشر الخاص بـ Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzNh85mkH-DISqJRFJXDyMFR0V9inslF8CUWTJ4MVwjwPCWLIvmp2hkAKKVEiz6tmt/exec";

  const quizData = {
    correctIndex: 1, // الخيار الخاطئ هو 0، والخيار الصحيح هو 1 ("لا، لا يحق له")
    ruling: "وفقاً للنظام، العقود الشفهية في بعض التصرفات تحتاج لإثبات، ولا يعتد بالعربون دون عقد مكتوب ومكتمل الشروط.",
    promoCode: "حقوق_2026"
  };

  let userData = { name: "", phone: "" };

  function startQuiz() {
    const name = document.getElementById('userName').value.trim();
    const phone = document.getElementById('userPhone').value.trim();
    if(!name || !phone) {
      alert('لطفاً أدخلي الاسم ورقم الجوال للمتابعة');
      return;
    }
    userData.name = name;
    userData.phone = phone;
    document.getElementById('userInfoStep').classList.add('hidden');
    document.getElementById('quizStep').classList.remove('hidden');
  }

  function submitAnswer(selectedIndex) {
    const isCorrect = (selectedIndex === quizData.correctIndex);
    const resultDiv = document.getElementById('result');
    const optionsDiv = document.getElementById('options');
    
    // تعطيل الخيارات لمنع الضغط المكرر
    optionsDiv.style.pointerEvents = 'none';
    optionsDiv.style.opacity = '0.6';

    if(isCorrect) {
      resultDiv.className = "result-box success";
      resultDiv.innerHTML = `
        <h3>إجابة صحيحة! 🎉</h3>
        <p>${quizData.ruling}</p>
        <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; margin-top: 10px;">
          كود الخصم الهديّة: <strong>${quizData.promoCode}</strong>
        </div>
      `;
    } else {
      resultDiv.className = "result-box error";
      resultDiv.innerHTML = `
        <h3>للأسف الإجابة خاطئة.. حاول الأربعاء القادم! 🌸</h3>
        <p>${quizData.ruling}</p>
      `;
    }
    resultDiv.classList.remove('hidden');

    // إرسال البيانات فوراً لجدول قوقل شيت
    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: userData.name,
        phone: userData.phone,
        selectedOption: selectedIndex === 0 ? "نعم، يحق له" : "لا، لا يحق له",
        isCorrect: isCorrect
      })
    });
  }
</script>

</body>
</html>
