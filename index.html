<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لغز الربوع - قضية اليوم</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f051d;
      --purple-glow: #a855f7;
      --purple-neon: #d8b4fe;
      --gold-police: #fbbf24;
      --card-bg: rgba(20, 10, 38, 0.88);
      --line: rgba(168, 85, 247, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Tajawal', sans-serif;
      background: radial-gradient(circle at center, #2e0854 0%, var(--bg-dark) 100%);
      color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulseGlow 4s infinite alternate ease-in-out;
    }
    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .police-tape {
      position: fixed;
      bottom: -10px;
      left: -10%;
      width: 120%;
      height: 38px;
      background: repeating-linear-gradient(
        -45deg,
        #f59e0b,
        #f59e0b 15px,
        #111 15px,
        #111 30px
      );
      color: #000;
      font-weight: 900;
      font-size: 14px;
      line-height: 38px;
      text-align: center;
      letter-spacing: 2px;
      transform: rotate(-3deg);
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
      border-top: 2px solid #fbbf24;
      border-bottom: 2px solid #fbbf24;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--line);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 30px 24px 24px;
      width: 100%; max-width: 460px;
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.25), inset 0 0 15px rgba(168, 85, 247, 0.15);
      position: relative;
      z-index: 2;
    }

    .club-logo-container {
      text-align: center;
      margin-bottom: 12px;
    }
    .logo-svg {
      width: 65px; height: 65px;
      filter: drop-shadow(0 0 10px rgba(216, 180, 254, 0.8));
    }
    .logo-title {
      font-size: 16px; font-weight: 800; color: #fff; margin-top: 5px;
    }
    .logo-sub {
      font-size: 12px; color: var(--purple-neon); opacity: 0.9;
    }

    h1.main-title {
      margin: 10px 0 5px;
      text-align: center;
      font-size: 34px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px var(--purple-glow), 0 0 25px var(--purple-glow);
    }

    p.sub { text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 22px; font-size: 13px; }

    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 14px; color: var(--purple-neon); }
    input[type="text"], input[type="tel"], textarea, select {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 3, 20, 0.6);
      color: #fff; font-size: 15px; font-family: inherit;
      outline: none; transition: 0.3s;
    }
    input:focus, textarea:focus {
      border-color: var(--purple-glow);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }
    textarea { resize: vertical; height: 75px; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: #fff; font-size: 17px; font-weight: 800;
      cursor: pointer; margin-top: 10px; transition: 0.3s;
      box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
    }
    .btn:hover {
      background: linear-gradient(135deg, #9d72ff, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    .opt-btn {
      width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px;
      border: 1px solid rgba(216, 180, 254, 0.3);
      background: rgba(255, 255, 255, 0.04);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; text-align: center;
      font-family: inherit; transition: 0.3s;
    }
    .opt-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--purple-glow);
      transform: scale(1.02);
    }

    .result-box { margin-top: 18px; padding: 16px; border-radius: 14px; text-align: center; line-height: 1.6; }
    .success { background: rgba(34, 197, 94, 0.2); border: 1.5px solid #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
    .error { background: rgba(239, 68, 68, 0.2); border: 1.5px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
    .hidden { display: none !important; }

    .admin-toggle {
      position: absolute; top: 15px; left: 15px;
      background: rgba(168, 85, 247, 0.2); border: 1px solid var(--purple-glow);
      color: #fff; border-radius: 50%; width: 38px; height: 38px;
      cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
      z-index: 10;
    }

      background: rgba(10, 3, 20, 0.95);
      border: 2px solid var(--purple-glow);
      border-radius: 18px; padding: 20px; margin-top
