<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قضية اليوم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a1245;--bg2:#6b3f9c;--ink:#fff;--soft:rgba(255,255,255,.72);--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.22);--gold:#e9d5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 18%,var(--bg2),var(--bg1) 70%) fixed #2a1245}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 40px;text-align:center}
.logo{width:150px;max-width:50%;display:block;margin:0 auto 6px}
.tag{font-size:13px;letter-spacing:.5px;color:var(--soft)}
h1{font-size:34px;font-weight:800;margin:6px 0 4px}
.date{color:var(--gold);font-size:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 20px;text-align:right;line-height:1.95;font-size:17px}
.card .lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:0 12px;margin-bottom:8px;line-height:24px}
.q{font-weight:700;font-size:18px;margin:16px 0 4px}
.opts{display:grid;gap:12px;margin-top:16px}
button.opt{font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;transition:.2s}
button.opt:hover,button.opt:focus-visible{background:rgba(255,255,255,.14);border-color:#fff;outline:none}
button.opt.sel{background:#fff;color:#3b1a63;border-color:#fff}
button.opt[disabled]:not(.sel){opacity:.45;cursor:default}
.note{margin-top:18px;color:var(--soft);font-size:15px;line-height:1.8}
.hide{display:none}
.ruling{margin-top:16px;background:#fff;color:#2a1245;border-radius:20px;padding:20px;text-align:right;line-height:1.95;font-size:16.5px;animation:up .5s ease}
.ruling b.h{display:block;font-size:19px;margin-bottom:4px;color:#5b2a91}
.gift-box{margin-top:12px;padding:12px;background:#f3e8ff;border-radius:12px;color:#3b1a63;font-weight:700;text-align:center}
.cd{display:flex;gap:10px;justify-content:center;margin-top:12px;direction:ltr}
.cd div{min-width:64px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 0;font-size:24px;font-weight:800}
.cd small{display:block;font-size:11px;font-weight:400;color:var(--soft)}
.foot{margin-top:28px;font-size:12px;color:var(--soft)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#adminbtn{position:fixed;left:14px;bottom:14px;z-index:99;font:inherit;font-weight:700;font-size:14px;color:#3b1a63;background:#fff;border:0;border-radius:99px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
#panel{position:fixed;inset:0;z-index:100;background:rgba(20,8,36,.9);overflow:auto;padding:20px}
#panel .in{max-width:520px;margin:0 auto;background:#fff;color:#2a1245;border-radius:20px;padding:20px;text-align:right}
#panel h2{margin:0 0 10px;font-size:20px}
#panel label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
#panel input,#panel textarea,#panel select{width:100%;font:inherit;font-size:15px;color:#2a1245;border:1.5px solid #cdb9e6;border-radius:10px;padding:8px;background:#fff}
#panel textarea{min-height:70px}
#panel .row{display:flex;gap:10px}#panel .row>div{flex:1}
#panel .btns{display:flex;gap:10px;margin-top:15px}
#panel button{flex:1;font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:10px;border:0;cursor:pointer}
#panel .ok{background:#5b2a91;color:#fff}#panel .no{background:#eee;color:#2a1245}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">وحدة الإرشاد الأكاديمي · كلية الحقوق والعلوم السياسية</div>
  <h1>قضية اليوم</h1>
  <div class="date" id="date">الثلاثاء، ٢ جمادى الأولى</div>

  <section id="closed" class="hide">
    <div class="card" style="text-align:center">
      <div class="lbl">حالة الفعالية</div>
      <p id="closedmsg" style="margin:6px 0 0">الفعالية مغلقة حالياً. انتظرونا قريباً ⚖️</p>
    </div>
  </section>

  <section id="open" class="hide">
    <div class="card">
      <span class="lbl" id="cno"></span>
      <div id="ctext"></div>
      <div class="q" id="cq"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="note" id="note">اختر رأيك، وبيظهر الحكم والتوضيح لاحقاً.</div>
    <div class="cd hide" id="cd"></div>
    <div class="ruling hide" id="ruling"></div>
  </section>
  <div class="foot" id="foot">قضية اليوم · كل الاثنين</div>
</div>

<script id="state" type="application/json">{
  "id":"1",
  "no":"القضية الأولى",
  "text":"اتفق سعد مع خالد شفهياً على بيع سيارته، واستلم منه عربوناً..",
  "q":"هل يحق لخالد إلزام سعد بإتمام البيع؟",
  "opts":["نعم، يحق له","لا، لا يحق له"],
  "correctIndex": 1,
  "revealHour": 5,
  "isOpen": true,
  "ruling":"الأصل أن العقد ينعقد بالتراضي، لكن الإشكال في إثبات الاتفاق الشفهي.",
  "supportMsg":"كفو! تحليل قانوني دقيق ومميز جداً ⚖️✨",
  "promoCode":"LAW50"
}</script>

<script>
var S = JSON.parse(document.getElementById('state').textContent);
var $ = function(i){return document.getElementById(i)};

function render(){
  $('closed').classList.add('hide'); $('open').classList.add('hide');
  $('opts').innerHTML=''; $('cd').classList.add('hide'); $('ruling').classList.add('hide');
  
  if(!S.isOpen){
    $('closedmsg.textContent') = 'الفعالية مغلقة حالياً بواسطة المشرفة. انتظرونا قريباً ⚖️';
    $('closed').classList.remove('hide'); return;
  }

  $('open').classList.remove('hide');
  $('cno').textContent = S.no; $('ctext').textContent = S.text; $('cq').textContent = S.q;
  
  var key = 'vote:' + S.id, saved = null;
  try{ saved = localStorage.getItem(key); }catch(e){}
  
  var box = $('opts');
  S.opts.forEach(function(o, i){
    var b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.onclick = function(){
      if(saved !== null) return;
      saved = String(i);
      try{ localStorage.setItem(key, saved); }catch(e){}
      paint();
    };
    box.appendChild(b);
  });

  function paint(){
    var bs = box.children;
    for(var i=0; i<bs.length; i++){
      bs[i].classList.toggle('sel', saved === String(i));
      bs[i].disabled = saved !== null;
    }
    if(saved !== null){
      $('note').textContent = 'تم تسجيل إجابتك بنجاح ✅';
      var r = $('ruling'); r.classList.remove('hide'); r.innerHTML = '';
      
      var b = document.createElement('b'); b.className = 'h'; b.textContent = 'الحكم والتوضيح'; r.appendChild(b);
      var s = document.createElement('span'); s.textContent = S.ruling; r.appendChild(s);

      // التحقق من الإجابة الصحيحة وإظهار الدعم والهدية
      if(Number(saved) === Number(S.correctIndex)){
        var sup = document.createElement('div');
        sup.style.cssText = 'margin-top:12px;font-weight:700;color:#5b2a91;';
        sup.textContent = S.supportMsg;
        r.appendChild(sup);

        if(S.promoCode){
          var g = document.createElement('div');
          g.className = 'gift-box';
          g.innerHTML = '🎁 هدية إجابتك الصحيحة (كود خصم): <span style="background:#fff;padding:2px 8px;border-radius:6px;color:#5b2a91;">' + S.promoCode + '</span>';
          r.appendChild(g);
        }
      }
    }
  }
  paint();
}
render();

// لوحة التحكم الخاصة بك لتعديل القضية والإعدادات
function openPanel(){
  if(document.getElementById('panel')) return;
  var p = document.createElement('div'); p.id = 'panel';
  p.innerHTML = '<div class="in"><h2>لوحة التحكم والتعديل</h2>' +
    '<label>عنوان القضية</label><input id="p_no" value="'+S.no+'">' +
    '<label>نص القضية</label><textarea id="p_text">'+S.text+'</textarea>' +
    '<label>السؤال</label><input id="p_q" value="'+S.q+'">' +
    '<div class="row"><div><label>الخيار الأول</label><input id="p_o0" value="'+(S.opts[0]||'')+'"></div><div><label>الخيار الثاني</label><input id="p_o1" value="'+(S.opts[1]||'')+'"></div></div>' +
    '<label>رقم الخيار الصحيح (0 للأول، 1 للثاني)</label><input id="p_corr" value="'+S.correctIndex+'">' +
    '<label>الحكم والتوضيح</label><textarea id="p_ruling">'+S.ruling+'</textarea>' +
    '<label>عبارة الدعم للإجابة الصحيحة</label><input id="p_sup" value="'+S.supportMsg+'">' +
    '<label>كود خصم الهدية</label><input id="p_code" value="'+S.promoCode+'">' +
    '<label>حالة الرابط</label><select id="p_open"><option value="true" '+(S.isOpen?'selected':'')+'>فتح الفعالية</option><option value="false" '+(!S.isOpen?'selected':'')+'>إغلاق الرابط</option></select>' +
    '<div class="btns"><button class="ok" id="p_save">حفظ التعديلات</button><button class="no" id="p_x">إلغاء</button></div></div>';
  document.body.appendChild(p);
  
  $('p_x').onclick = function(){ p.remove(); };
  $('p_save').onclick = function(){
    S.no = $('p_no').value.trim();
    S.text = $('p_text').value.trim();
    S.q = $('p_q').value.trim();
    S.opts = [$('p_o0').value.trim(), $('p_o1').value.trim()];
    S.correctIndex = +$('p_corr').value;
    S.ruling = $('p_ruling').value.trim();
    S.supportMsg = $('p_sup').value.trim();
    S.promoCode = $('p_code').value.trim();
    S.isOpen = $('p_open').value === 'true';
    
    $('state').textContent = JSON.stringify(S);
    p.remove();
    render();
    alert('تم حفظ التعديلات بنجاح! يمكنك نسخ الكود المحدث لحفظه.');
  };
}

// زر التحكم السريع يظهر لك أسفل الصفحة
var btn = document.createElement('button');
btn.id = 'adminbtn'; btn.textContent = '⚙️ لوحة التعديل';
btn.onclick = openPanel;
document.body.appendChild(btn);
</script>
</body></html>
